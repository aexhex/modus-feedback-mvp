# Автопроверка: на каждый push в main и на каждый PR — переводы, серверные тесты и тесты интерфейса.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Словари перевода полные
        run: npm run i18n:check
      - name: Серверные тесты
        run: npm test
      - name: Браузер для тестов интерфейса
        run: npx playwright install --with-deps chromium
      - name: Тесты интерфейса
        run: npm run test:e2e
      - name: Отчёт Playwright при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
